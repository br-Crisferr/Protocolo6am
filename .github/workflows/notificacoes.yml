name: Alarmes Protocolo 6AM

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  enviar-notificacoes:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar e enviar alarmes
        uses: actions/github-script@v7
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          script: |
            const https = require('https');
            const crypto = require('crypto');

            // ── Carregar credenciais da conta de serviço ──
            const SA = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            const PROJECT_ID = SA.project_id;

            // ── Hora atual em Brasília ──
            const now = new Date();
            const brt = new Date(now.toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
            const HH = String(brt.getHours()).padStart(2, '0');
            const MM = String(brt.getMinutes()).padStart(2, '0');
            const horaAgora = `${HH}:${MM}`;
            console.log(`⏰ Verificando alarmes para ${horaAgora} BRT`);

            // ── Gerar JWT para autenticação OAuth2 ──
            function base64url(str) {
              return Buffer.from(str).toString('base64')
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
            }

            function makeJWT() {
              const header = base64url(JSON.stringify({ alg: 'RS256', typ: 'JWT' }));
              const now = Math.floor(Date.now() / 1000);
              const payload = base64url(JSON.stringify({
                iss: SA.client_email,
                scope: 'https://www.googleapis.com/auth/firebase.messaging https://www.googleapis.com/auth/datastore',
                aud: 'https://oauth2.googleapis.com/token',
                exp: now + 3600,
                iat: now
              }));
              const sign = crypto.createSign('RSA-SHA256');
              sign.update(`${header}.${payload}`);
              const sig = sign.sign(SA.private_key, 'base64')
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
              return `${header}.${payload}.${sig}`;
            }

            // ── Requisição HTTPS genérica ──
            function req(options, body) {
              return new Promise((resolve, reject) => {
                const r = https.request(options, res => {
                  let d = '';
                  res.on('data', c => d += c);
                  res.on('end', () => {
                    try { resolve({ status: res.statusCode, body: JSON.parse(d) }); }
                    catch(e) { resolve({ status: res.statusCode, body: d }); }
                  });
                });
                r.on('error', reject);
                if (body) r.write(typeof body === 'string' ? body : JSON.stringify(body));
                r.end();
              });
            }

            // ── Obter Access Token OAuth2 ──
            const jwt = makeJWT();
            const tokenResp = await req({
              hostname: 'oauth2.googleapis.com',
              path: '/token',
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
            }, `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`);

            if (!tokenResp.body.access_token) {
              console.error('Erro ao obter token:', JSON.stringify(tokenResp.body));
              return;
            }
            const ACCESS_TOKEN = tokenResp.body.access_token;
            console.log('✅ Token OAuth2 obtido');

            // ── Buscar usuários no Firestore ──
            const fsResp = await req({
              hostname: 'firestore.googleapis.com',
              path: `/v1/projects/${PROJECT_ID}/databases/(default)/documents/users?pageSize=200`,
              method: 'GET',
              headers: { 'Authorization': `Bearer ${ACCESS_TOKEN}` }
            });

            if (!fsResp.body.documents) {
              console.log('Nenhum usuário encontrado.');
              return;
            }

            console.log(`👥 ${fsResp.body.documents.length} usuário(s) encontrado(s)`);
            let enviados = 0;

            for (const userDoc of fsResp.body.documents) {
              const f = userDoc.fields || {};
              const fcmToken = f.fcmToken?.stringValue;
              if (!fcmToken) continue;
              if (f.banned?.booleanValue) continue;

              const userName = f.name?.stringValue || f.nomeGuerra?.stringValue || 'Operador';
              const tasks = f.tasks?.arrayValue?.values || [];

              for (const tv of tasks) {
                const t = tv.mapValue?.fields || {};
                const alarmTime = t.alarmTime?.stringValue || '';
                const notif     = t.notif?.booleanValue || false;
                const done      = t.done?.booleanValue || false;
                const taskName  = t.name?.stringValue || 'Tarefa';
                const score     = parseInt(t.score?.integerValue || t.score?.doubleValue || 5);

                if (!alarmTime || !notif || done) continue;
                if (alarmTime !== horaAgora) continue;

                console.log(`🔔 Enviando: "${taskName}" → ${userName} (${alarmTime})`);

                // ── Enviar push via FCM v1 ──
                const fcmResp = await req({
                  hostname: 'fcm.googleapis.com',
                  path: `/v1/projects/${PROJECT_ID}/messages:send`,
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${ACCESS_TOKEN}`,
                    'Content-Type': 'application/json'
                  }
                }, {
                  message: {
                    token: fcmToken,
                    notification: {
                      title: `🔔 ${taskName}`,
                      body: `Hora de executar! +${score} XP`
                    },
                    android: {
                      priority: 'high',
                      notification: {
                        icon: 'icon_192',
                        sound: 'default',
                        channel_id: 'alarmes'
                      }
                    },
                    webpush: {
                      notification: {
                        icon: 'https://br-crisferr.github.io/Protocolo6am/icon-192.png',
                        badge: 'https://br-crisferr.github.io/Protocolo6am/icon-192.png'
                      },
                      fcm_options: {
                        link: 'https://br-crisferr.github.io/Protocolo6am/'
                      }
                    }
                  }
                });

                if (fcmResp.status === 200) {
                  console.log(`✅ Enviado com sucesso para ${userName}`);
                  enviados++;
                } else {
                  console.warn(`⚠️ Erro FCM ${fcmResp.status}:`, JSON.stringify(fcmResp.body).slice(0, 200));
                }
              }
            }

            console.log(`\n✅ Concluído: ${enviados} notificação(ões) enviada(s).`);
